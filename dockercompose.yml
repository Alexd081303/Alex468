version: '3.8'

services:
  app:
    build: ./docker
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      - MONGO_HOSTNAME=mongo
      - MONGO_PORT=27017
      - MONGO_DB=sharkinfo
      - API_URL=http://api:5000
    restart: on-failure
    networks:
      - app-network

  api:
    build: ./api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: on-failure
    networks:
      - app-network

  worker:
    build: ./worker
    depends_on:
      - mongo
      - api
    environment:
      - MONGO_HOSTNAME=mongo
      - MONGO_PORT=27017
      - MONGO_DB=sharkinfo
      - API_URL=http://api:5000
      - POLL_INTERVAL=30
    restart: on-failure
    networks:
      - app-network

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
